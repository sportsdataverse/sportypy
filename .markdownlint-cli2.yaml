# markdownlint-cli2 (run by pre-commit). Every rule is on except the ones below
config:
  default: true
  # Prose, tables, long URLs and badge HTML routinely run past any line limit
  MD013: false
  # Per-release changelog sections repeat "Fixes" / "New surfaces" headings
  MD024:
    siblings_only: true
  # HTML for the README's logo, badges and star-history <picture>, and the
  # <div>s and rules the docs pages use
  MD033:
    allowed_elements: [a, img, br, sub, sup, details, summary, picture, source, div, span, strong, code, hr]
  # Bold lead-ins ("**League Office** —") are list content, not headings
  MD036: false
  # The README's first line is a heading with the logo inline; docs pages
  # carry their title in front matter
  MD041: false
  # Badges and the logo have no alt text by long-standing convention
  MD045: false
  # compact (|---|) and padded (| --- |) tables coexist
  MD060: false

ignores:
  - ".venv/**"
  - "rule-books/**"
  - ".claude/**"
  # written by tools/gen_docs.py on every site build (never committed)
  - "website/docs/reference/**"
  - "website/docs/getting-started.md"
  - "website/docs/cookbooks/**"
  - "website/docs/cookbooks.md"
  - "website/src/pages/CHANGELOG.md"
  - "website/node_modules/**"
  - "website/build/**"
