# Builds the Docusaurus site from main and publishes it to the gh-pages branch
# as a single orphan commit (no history growth). Vercel serves that branch as
# plain static files (production branch gh-pages, every other branch's build
# skipped), so the build runs here, not on Vercel. docs/static/vercel.json is
# copied to the branch root and carries the redirects from the old Sphinx URLs.
name: docs-deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "sportypy/**"
      - "tools/gen_docs.py"
      - "examples/notebooks/**"
      - "README.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    name: build and publish to gh-pages
    # workflow_dispatch can be launched from any branch; only main publishes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: 📥 Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # The job holds contents:write but the build runs third-party yarn
        # scripts; the publish step passes its token explicitly instead
        persist-credentials: false
    - name: 📦 Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        python-version: '3.13'
        # No caches in the job that publishes: a cache a pull request wrote could
        # otherwise reach the live site
        enable-cache: false

    - name: 🟢 Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: 24

    - name: 📦 Install the site's dependencies
      working-directory: docs
      run: npx --yes yarn@1.22.22 install --frozen-lockfile --non-interactive

    - name: 🔨 Generate the reference and build the site
      working-directory: docs
      run: npx --yes yarn@1.22.22 build

    - name: 🚀 Publish to gh-pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build
        # One commit: each deploy replaces the last
        force_orphan: true
