# Cuts a semantic-versioned release whenever commits land on main.
#
# semantic-release reads the conventional-commit messages since the last tag:
#   - fix: / perf:                 -> patch release
#   - feat:                        -> minor release
#   - "!" or BREAKING CHANGE:      -> major release
#   - docs:, ci:, chore:, etc.     -> no release
#
# On release it bumps pyproject.toml and uv.lock (`uv version`), prepends the
# notes to CHANGELOG.md, pushes a "chore(release)" commit + tag to main and
# publishes a GitHub release. That release is what triggers upload-to-pypi.yml,
# which is why the job pushes with a GitHub App token: events created with
# GITHUB_TOKEN do not start other workflows. Configuration lives in
# .releaserc.json.
#
# Prerequisite: a v<version> tag on main for the version pyproject.toml already
# has, so the first run counts commits from there, not from the oldest tag.
#
# main is branch-protected, so the app token also lets the job push to it. Setup:
#   1. Create a GitHub App with Contents, Issues, and Pull requests set to
#      read & write, and install it on this repository
#   2. Add the app to main's "Allow specified actors to bypass required pull
#      requests" list
#   3. Store its Client ID as the RELEASE_APP_CLIENT_ID secret and a private
#      key as the RELEASE_APP_PRIVATE_KEY secret in the "releases" environment,
#      with that environment's deployment branches limited to main so the
#      secrets can't be used from a manual run on another branch
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two releases at once; queue rather than cancel so no merge is skipped
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: releases
    # The release commit itself carries [skip ci], but guard against loops anyway
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: 🔑 Create the GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # only what semantic-release needs: push the release commit and tag,
          # create the release, comment on the PRs and issues it includes
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: 📥 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Check out main's current head rather than the triggering SHA, so a
          # run that queued behind another release isn't left behind main
          ref: main
          # semantic-release needs full history and tags to find the last release
          fetch-depth: 0
          # semantic-release pushes with GITHUB_TOKEN below, not the checkout token
          persist-credentials: false

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24

      # `uv version` (run by the exec plugin) bumps pyproject.toml and uv.lock
      - name: 📦 Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false

      - name: 🤖 Resolve the app bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: 🚀 Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
        run: >
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
