# Fails when sportypy's surface dimensions have drifted from sportyR's, or a
# league sportyR draws is missing here. sportyR is the source of truth
# (CLAUDE.md: "sportyR parity"), so a failure here means a port is due:
#
#   python tools/sync_dimensions.py PATH/TO/surface-dimensions.json --align
#
# The check lives in tools/sync_dimensions.py. It prints a "drift:" line for each
# differing value and a "missing:" line for each absent league, but exits 1 only
# for missing leagues, so this workflow fails on either line. It runs weekly (a
# failed scheduled run emails the repo admins), on pull requests that touch the
# dimensions or the tool, and on demand.
name: dimensions-drift

on:
  schedule:
    - cron: '41 7 * * 1'
  pull_request:
    paths:
      - sportypy/data/surface_dimensions.json
      - tools/sync_dimensions.py
      - .github/workflows/dimensions-drift.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: sportypy vs sportyR dimensions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Fetch sportyR's surface dimensions
      run: curl --fail --silent --show-error --location --output "$RUNNER_TEMP/sportyr-dimensions.json" https://raw.githubusercontent.com/sportsdataverse/sportyR/main/data-raw/surface-dimensions.json

    # tools/sync_dimensions.py uses only the standard library
    - name: Compare
      run: |
        python3 tools/sync_dimensions.py "$RUNNER_TEMP/sportyr-dimensions.json" --check | tee "$RUNNER_TEMP/drift.txt"
        if grep -qE '^(drift|missing):' "$RUNNER_TEMP/drift.txt"; then
          echo "::error::sportypy's dimensions differ from sportyR's; run tools/sync_dimensions.py with --align"
          exit 1
        fi
