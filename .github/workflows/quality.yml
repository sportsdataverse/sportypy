# Static checks: ruff, the pre-commit hooks, zizmor on the publishing workflow,
# and a build of the sdist and wheel. No tests (package-coverage runs those)
name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # a PR's runs share one group (a new push supersedes the last); each push to
  # main gets its own
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: ruff + pre-commit + zizmor
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        python-version: '3.13'
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install the lint group
      run: uv sync --locked --no-default-groups --group lint

    - name: ruff
      run: uv run --no-sync ruff check .

    - name: pre-commit hooks
      run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

    - name: zizmor (the workflow that holds the PyPI credentials)
      run: uvx zizmor@1.30.1 --offline .github/workflows/upload-to-pypi.yml

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Build
      run: uv build

    - name: Check the distributions' metadata
      run: uvx twine check --strict dist/*

    - name: The wheel ships the surface dimensions
      run: |
        unzip -l dist/*.whl | grep -q 'sportypy/data/surface_dimensions.json'
        unzip -l dist/*.whl | grep -q 'sportypy/data/unit_conversions.json'
