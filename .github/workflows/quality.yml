# Static checks: ruff, the pre-commit hooks, zizmor on the publishing workflows,
# and a build of the sdist and wheel. No tests (package-coverage runs those)
name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # a PR's runs share one group (a new push supersedes the last); each push to
  # main gets its own
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: ruff + pre-commit + zizmor
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        python-version: '3.13'
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install the lint group
      run: uv sync --locked --no-default-groups --group lint

    - name: ruff
      run: uv run --no-sync ruff check .

    - name: pre-commit hooks
      run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

    - name: zizmor (the workflows that publish to PyPI and gh-pages)
      run: uvx zizmor@1.30.1 --offline .github/workflows/upload-to-pypi.yml .github/workflows/docs-deploy.yml

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Build
      run: uv build

    - name: Check the distributions' metadata
      run: uvx twine check --strict dist/*

    - name: The wheel ships the surface dimensions
      run: |
        unzip -l dist/*.whl | grep -q 'sportypy/data/surface_dimensions.json'
        unzip -l dist/*.whl | grep -q 'sportypy/data/unit_conversions.json'
