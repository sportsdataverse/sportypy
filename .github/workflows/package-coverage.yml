name: package-coverage

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Test sportypy (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest supported Pythons, from the lockfile
        python-version: ['3.10', '3.14']
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install sportypy and test dependencies
      run: uv sync --locked --no-default-groups --group test

    - name: Run tests and collect coverage
      run: uv run --no-sync pytest --cov=sportypy tests/ --cov-report=xml --cov-report=term

    - name: Upload coverage reports to codecov.io
      if: matrix.python-version == '3.10'
      uses: codecov/codecov-action@v5
