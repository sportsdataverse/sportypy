name: package-coverage

on: [push, pull_request]

jobs:
  build:
    # ubuntu-latest (26.04) has no Python 3.9 build for setup-python
    runs-on: ubuntu-24.04
    name: Test sportypy (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python with the pinned requirements, and the
        # newest with the latest releases of the dependencies
        python-version: ['3.9', '3.14']
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install requirements
      if: matrix.python-version == '3.9'
      run: pip install -r requirements.txt

    - name: Install pytest, pytest-cov, and coverage
      run: python -m pip install pytest pytest-cov coverage

    - name: Install sportypy
      run: python -m pip install .

    - name: Run tests and collect coverage
      run: pytest --cov=sportypy tests/ --cov-config=.coveragerc --cov-report=xml --cov-report=term

    - name: Upload coverage reports to codecov.io
      if: matrix.python-version == '3.9'
      uses: codecov/codecov-action@v5