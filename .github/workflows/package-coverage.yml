name: package-coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Test sportypy (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest supported Pythons, from the lockfile
        python-version: ['3.10', '3.14']
    steps:
    - name: 📥 Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: 📦 Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: 📦 Install sportypy and the test dependencies
      run: uv sync --locked --no-default-groups --group test

    - name: 🧪 Run the tests and collect coverage
      run: uv run --no-sync pytest --cov=sportypy tests/ --cov-report=xml --cov-report=term

    - name: 📊 Upload coverage to Codecov
      if: matrix.python-version == '3.10'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        # The action does not read repo secrets on its own. A pull request from a
        # fork gets an empty token, which Codecov accepts for forks
        token: ${{ secrets.CODECOV_TOKEN }}
        # Fail the job on a rejected upload, so a missing report is not silent
        fail_ci_if_error: true
