# Taken from: https://github.com/sportsdataverse/sportsdataverse-py/blob/main/.github/workflows/python-publish.yml
name: Upload sportypy to PyPI

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: 📥 Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: 📦 Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        enable-cache: false
    - name: 🔨 Build the sdist and wheel
      run: uv build
    - name: 📤 Keep the distributions for the publish job
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    # A separate job, so the build backend never runs with id-token: write
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PyPI trusted publishing: uv publish trades this job's OIDC token for an upload token
      id-token: write

    steps:
    - name: 📥 Fetch the distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/
    - name: 📦 Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        enable-cache: false
    - name: 🚀 Publish to PyPI
      # Authenticates through the trusted publisher configured on PyPI for this
      # workflow file, so no PyPI credentials are stored in the repo
      # --check-url skips files PyPI already has, so a re-run after a partial upload
      # publishes only the missing distributions
      run: uv publish --check-url https://pypi.org/simple/
