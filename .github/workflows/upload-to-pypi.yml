# Taken from: https://github.com/sportsdataverse/sportsdataverse-py/blob/main/.github/workflows/python-publish.yml
name: Upload sportypy to PyPI

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        enable-cache: false
    - name: Build
      run: uv build
    - name: Publish
      env:
        UV_PUBLISH_USERNAME: ${{ secrets.PYPI_USERNAME }}
        UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      # A PyPI trusted publisher (OIDC) would replace the stored credentials;
      # it needs configuring on PyPI by the project owner first
      # --check-url skips files PyPI already has, so a re-run after a partial upload
      # publishes only the missing distributions
      run: uv publish --check-url https://pypi.org/simple/  # zizmor: ignore[use-trusted-publishing]
