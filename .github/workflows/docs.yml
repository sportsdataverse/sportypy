# Builds the Sphinx site with warnings as errors, so a broken page, reference
# or docstring fails the PR. It builds to a scratch directory; the site
# committed under docs/_build is not touched
name: docs

on:
  pull_request:
    paths: &docs-paths
      - "docs/**"
      - "sportypy/**"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths: *docs-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sphinx:
    name: sphinx build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        python-version: '3.13'
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install sportypy and the docs group
      run: uv sync --locked --no-default-groups --group docs

    - name: Build the site (warnings are errors)
      run: uv run --no-sync sphinx-build -W --keep-going -b html -d "$RUNNER_TEMP/doctrees" docs "$RUNNER_TEMP/html"
