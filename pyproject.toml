[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[project]
name = "sportypy"
version = "1.2.0"
description = "Draw sports surfaces according to rulebook specifications"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Ross Drucker", email = "ross.a.drucker@gmail.com" }]
maintainers = [{ name = "Ross Drucker", email = "ross.a.drucker@gmail.com" }]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib>=3.8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Source = "https://github.com/sportsdataverse/sportypy"
Docs = "https://sportypy.sportsdataverse.org/"
"Bug Tracker" = "https://github.com/sportsdataverse/sportypy/issues"

[dependency-groups]
test = ["pytest", "pytest-cov"]
lint = [
    "pre-commit>=4",
    "ruff==0.15.12",
]
docs = [
    "sphinx",
    "livereload",
    "myst-parser",
    "sphinx-markdown-builder",
    "sphinx-bootstrap-theme",
    "griffe>=2.3.0",
]
# Runs the notebooks in examples/notebooks/ (live data). Not in dev, so CI and the docs build never install it:
# uv run --group cookbook jupyter nbconvert --to notebook --execute --inplace examples/notebooks/*.ipynb
cookbook = [
    "sportsdataverse>=0.1.4",
    "sdvplot[surfaces]>=0.1.1",
    "ipykernel",
    "nbconvert>=7",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
# The package sits at the repo root rather than under src/
module-root = ""

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::RuntimeWarning",
    "ignore::UserWarning",
]

[tool.coverage.report]
exclude_lines = [
    # Skip any pass lines (e.g. a pass statement in an @abstractmethod)
    "pass",
    # Standard pragma
    "pragma: no cover",
]
